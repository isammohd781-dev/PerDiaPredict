# nginx inside the Render container: one public port, three Streamlit apps.
#   /         -> patient app (8501)
#   /doctor/  -> doctor app  (8502)
#   /admin/   -> admin app   (8503)
# __PORT__ is replaced with Render's $PORT by deploy/render-start.sh.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 6m;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen __PORT__;
        absolute_redirect off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
        proxy_buffering off;

        location = /doctor { return 301 /doctor/; }
        location = /admin  { return 301 /admin/; }
        location /doctor/  { proxy_pass http://127.0.0.1:8502; }
        location /admin/   { proxy_pass http://127.0.0.1:8503; }
        location /         { proxy_pass http://127.0.0.1:8501; }
    }
}
